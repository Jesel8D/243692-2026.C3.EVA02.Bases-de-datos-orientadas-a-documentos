name: ${PROJECT_NAME:-jsonbench}

x-resources: &resources
  platform: linux/amd64
  cpu_period: ${CPU_PERIOD_US:?Run via scripts/start_services.sh}
  cpu_quota: ${CPU_QUOTA_US:?Resource profile required}
  mem_limit: ${MEMORY_BYTES:?Resource profile required}
  # Literal requested by P §3; Docker may discard this on cgroups v2.
  mem_swappiness: 0
  # Explicit opt-in adaptation, checked by start_services.sh; not literal equivalence.
  memswap_limit: ${MEMORY_BYTES:?Resource profile required}
  cgroup: private
  restart: "no"
  stop_grace_period: 60s
  networks: [database]
  labels:
    academic.profile: ${PROFILE_ID:?Resource profile required}
    academic.swap_policy: no-swap-adaptation
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongodb:
    <<: *resources
    image: ${MONGO_IMAGE:-mongo:9.0.4-resolute@sha256:714cc3db1e396e5a464b8443ccde50e53283368809401f53f1997b684ddb5be0}
    command: [mongod, --bind_ip_all, --storageEngine, wiredTiger]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set local MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set local MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'const c = new Mongo("mongodb://127.0.0.1:27017"); const a = c.getDB("admin"); if (!a.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) quit(1); if (a.runCommand({ping:1}).ok !== 1) quit(1);'
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    # No host ports by default; optional loopback override in config/.
  postgres:
    <<: *resources
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set local POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jsonbench}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    shm_size: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -tAc 'SELECT 1' | grep -qx 1
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s

networks:
  database:
    internal: true
volumes:
  mongo_data:
  mongo_config:
  postgres_data:
